<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moshruum Patch</title>
<meta name="description" content="Grow mushrooms, plate dishes and make mushroom café drinks with Moshruums, an urban mushroom farm in Metro Detroit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Josefin+Sans:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg id="defsHost" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"></svg>
<div class="app">
  <header class="site">
    <a class="brand" id="brand" href="https://moshruums.com" target="_blank" rel="noopener"><span class="brand-word">MOSHRUUMS</span><span class="brand-game">Patch</span></a>
    <nav class="nav" role="tablist" aria-label="Sections">
      <button role="tab" id="nav-grow" data-view="grow" aria-controls="v-grow"><b>Grow</b><small>Farm rack</small></button>
      <button role="tab" id="nav-kitchen" data-view="kitchen" aria-controls="v-kitchen"><b>Kitchen</b><small>Cooking recipes</small></button>
      <button role="tab" id="nav-cafe" data-view="cafe" aria-controls="v-cafe"><b>Café</b><small>Barista recipes</small></button>
    </nav>
    <button class="icon-btn" id="soundBtn" aria-pressed="true" aria-label="Sound on" title="Sound"></button>
  </header>

  <main>
    <!-- Grow -->
    <section id="v-grow" class="view" role="tabpanel" aria-labelledby="nav-grow" hidden>
      <div class="studio">
        <div class="stage">
          <div class="stage-top" id="growTop"></div>
          <svg id="rackSvg" class="stage-svg rack" viewBox="0 0 400 420" role="group" aria-label="Grow rack with four slots">
            <g id="rackLayer"></g><g id="growFx"></g>
          </svg>
          <div class="stage-foot"><p class="hint" id="growNote" role="status" aria-live="polite"></p></div>
        </div>
        <aside class="tools" id="growTools"></aside>
      </div>
    </section>

    <!-- Kitchen -->
    <section id="v-kitchen" class="view" role="tabpanel" aria-labelledby="nav-kitchen" hidden>
      <div class="subnav" role="tablist" aria-label="Kitchen">
        <button role="tab" data-sub="create" id="k-sub-create"><b>Plate a dish</b><small>arrange and share</small></button>
        <button role="tab" data-sub="book" id="k-sub-book"><b>Recipe Book</b><small id="kBookCount">recipes</small></button>
      </div>
      <div class="studio" id="kitchenCreate">
        <div class="stage">
          <div class="stage-top">
            <button class="b2 ghost" id="kSurface"><b>Surface</b><small id="kSurfaceName"></small></button>
            <button class="b2 outline" id="kReset"><b>Start over</b><small>clear the plate</small></button>
            <button class="b2 dark" id="kFinish"><b>Finish</b><small>name and share</small></button>
          </div>
          <svg id="dishSvg" class="stage-svg dish" viewBox="0 0 400 400" role="img" aria-label="Your plate"></svg>
          <div class="stage-foot">
            <div class="foot-actions"><button class="link" id="kUndo">↶ Undo</button><button class="link" id="kRemove">✕ Remove</button></div>
            <p class="hint">Tap to add · Drag to arrange</p>
          </div>
        </div>
        <aside class="tools" id="kitchenTools"></aside>
      </div>
      <div class="book" id="kitchenBook" hidden></div>
    </section>

    <!-- Cafe -->
    <section id="v-cafe" class="view" role="tabpanel" aria-labelledby="nav-cafe" hidden>
      <div class="subnav" role="tablist" aria-label="Café">
        <button role="tab" data-sub="create" id="c-sub-create"><b>Make a drink</b><small>step by step</small></button>
        <button role="tab" data-sub="book" id="c-sub-book"><b>Café Menu</b><small id="cBookCount">drinks</small></button>
      </div>
      <div class="studio" id="cafeCreate">
        <div class="stage">
          <div class="stage-top">
            <button class="b2 ghost" id="cSurface"><b>Counter</b><small id="cSurfaceName"></small></button>
            <button class="b2 outline" id="cReset"><b>Start over</b><small>a fresh cup</small></button>
            <button class="b2 dark" id="cFinish"><b>Finish</b><small>name and share</small></button>
          </div>
          <svg id="drinkSvg" class="stage-svg" viewBox="0 0 400 400" role="img" aria-label="Your drink"></svg>
          <div class="stage-foot"><p class="drink-name" id="drinkName"></p></div>
        </div>
        <aside class="tools" id="cafeTools"></aside>
      </div>
      <div class="book" id="cafeBook" hidden></div>
    </section>
  </main>

  <footer class="site-foot">
    <span>A game from Moshruums, an urban mushroom farm in Metro Detroit.</span>
    <a id="shopLink" href="https://moshruums.com" target="_blank" rel="noopener">Visit the shop ↗</a>
  </footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="sheet"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/data.js"></script>
<script src="js/art.js"></script>
<script src="js/ingredients.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
