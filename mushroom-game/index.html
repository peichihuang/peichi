<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moshruum Patch</title>
<meta name="description" content="Grow your own little digital mushroom with Moshruums, an urban mushroom farm in Metro Detroit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Gluten:wght@500;700&family=Karla:wght@400;600;700&display=swap">
<style>
/* Layout: a fruiting-chamber scene on the left, the grower's clipboard on the right; stacks on phones. */
:root {
  --fog: #E3EADD;        /* page: damp grow-room air */
  --card: #F7F9F3;       /* panels */
  --moss: #2F412C;       /* ink */
  --moss-2: #5B6D55;     /* secondary ink */
  --line: #CAD6C2;       /* hairlines, tracks */
  --pink: #B44F6E;       /* pink oyster: primary actions */
  --pink-soft: #F6DCE3;
  --lamp: #F2C14E;       /* grow-lamp highlight */
  --ok: #5C8A4C;
  --warn: #C27A22;
  --f-display: "Gluten", "Baloo 2", ui-rounded, "Trebuchet MS", sans-serif;
  --f-body: "Karla", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--fog);
  color: var(--moss);
  font: 16px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 28px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }

.app { max-width: 1040px; margin: 0 auto; display: grid; gap: 18px; }

/* Header */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--moss); margin-right: auto; }
.brand svg { width: 36px; height: 36px; }
.brand span { font: 700 1.6rem/1 var(--f-display); letter-spacing: .01em; padding-top: 4px; }
.tabs { display: flex; gap: 4px; background: var(--card); padding: 4px; border-radius: 999px; border: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; font-weight: 600; color: var(--moss-2); }
.tabs button[aria-selected="true"] { background: var(--moss); color: var(--card); }
.tabs .count { font: 500 .75rem var(--f-mono); opacity: .8; margin-left: 4px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--moss); }
.icon-btn svg { width: 20px; height: 20px; }

/* Grow room */
.grow { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.scene-wrap { position: relative; border-radius: 28px; overflow: hidden; aspect-ratio: 400 / 440; max-width: 100%; background: #DCE6D6; box-shadow: 0 1px 0 #fff inset, 0 18px 40px -24px rgba(47, 65, 44, .45); }
.scene-wrap svg { display: block; width: 100%; height: 100%; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 22px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
.eyebrow { margin: 0; font: 500 .75rem/1.2 var(--f-mono); text-transform: uppercase; letter-spacing: .12em; color: var(--moss-2); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.05; margin: 0; text-wrap: balance; }
h2 { font-size: 2.1rem; }
h3 { font-size: 1.4rem; }
.lede { margin: 0; color: var(--moss-2); max-width: 46ch; }

.stage-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px; border-radius: 999px; background: var(--pink-soft); color: var(--pink); font: 500 .78rem/1.3 var(--f-mono); letter-spacing: .04em; text-transform: uppercase; }
.pill.ready { background: var(--lamp); color: var(--moss); }
.pill.glow { background: #E3F5D6; color: #3E7A2E; }
.sub { margin: 4px 0 0; color: var(--moss-2); }

.progress { display: grid; gap: 6px; }
.progress-top { display: flex; justify-content: space-between; font: 500 .8rem var(--f-mono); color: var(--moss-2); }
.track { position: relative; height: 12px; border-radius: 999px; background: var(--fog); overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--moss); transition: width .6s ease; }
.ticks { position: absolute; inset: 0; }
.ticks i { position: absolute; top: 2px; bottom: 2px; width: 2px; background: var(--card); opacity: .9; }

.meters { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.meter { background: var(--fog); border-radius: 16px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.meter-top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.meter-name { font-weight: 700; font-size: .9rem; }
.meter-val { font: 500 .95rem var(--f-mono); font-variant-numeric: tabular-nums; }
.meter .track { height: 10px; background: var(--card); }
.meter .band { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, rgba(92, 138, 76, .28) 0 4px, rgba(92, 138, 76, .12) 4px 8px); }
.meter .dot { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--ok); border: 2px solid var(--card); transition: left .6s ease, background .3s; }
.meter.off .dot { background: var(--warn); }
.meter-ideal { font: .72rem var(--f-mono); color: var(--moss-2); }

.note { margin: 0; min-height: 3em; padding: 10px 14px; border-radius: 14px; background: #FFF6DC; color: #5A4A1E; font-size: .95rem; }
.note.calm { background: var(--fog); color: var(--moss-2); }

.actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.act { border: 1.5px solid var(--line); background: #fff; border-radius: 18px; padding: 12px 6px 10px; display: grid; justify-items: center; gap: 4px; transition: transform .15s ease, border-color .15s, background .15s; }
.act svg { width: 34px; height: 34px; }
.act b { font-size: .98rem; }
.act small { font: .7rem var(--f-mono); color: var(--moss-2); }
.act:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--pink); }
.act:active:not(:disabled) { transform: translateY(1px); }
.act:disabled { opacity: .5; cursor: default; }

.btn { border: 0; border-radius: 999px; padding: 13px 22px; font-weight: 700; font-size: 1.05rem; }
.btn.primary { background: var(--pink); color: #fff; box-shadow: 0 6px 0 -1px #8A3953; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.primary:active { transform: translateY(3px); box-shadow: 0 3px 0 -1px #8A3953; }
.btn.ghost { background: transparent; color: var(--moss-2); padding: 8px 4px; font-weight: 600; font-size: .92rem; text-decoration: underline; text-underline-offset: 3px; }
.btn.soft { background: var(--fog); color: var(--moss); }
.minor { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.confirm { display: grid; gap: 10px; padding: 12px 14px; border-radius: 14px; border: 1px dashed var(--line); }
.confirm p { margin: 0; }
.confirm div { display: flex; gap: 10px; flex-wrap: wrap; }

/* Planting */
.picker { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.seed { border: 1.5px solid var(--line); background: #fff; border-radius: 16px; padding: 6px 4px 8px; display: grid; justify-items: center; gap: 2px; font-size: .82rem; font-weight: 600; line-height: 1.15; text-align: center; }
.seed svg { width: 100%; max-width: 74px; aspect-ratio: 1; }
.seed[aria-checked="true"] { border-color: var(--pink); background: var(--pink-soft); box-shadow: 0 0 0 2px var(--pink) inset; }
.picked { margin: 0; color: var(--moss-2); font-size: .95rem; }
.picked em { font-style: italic; }
.field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.field label { font-weight: 700; }
.name-row { display: flex; gap: 8px; }
.name-row input { flex: 1; min-width: 0; border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 14px; background: #fff; font-size: 1.05rem; }

/* Field guide */
.guide { display: grid; gap: 22px; }
.guide-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.guide-head p { margin: 0; color: var(--moss-2); font: 500 .9rem var(--f-mono); }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 820px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .cards { grid-template-columns: minmax(0, 1fr); } }
.spec { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; display: grid; grid-template-rows: auto auto 1fr; gap: 8px; min-width: 0; }
.spec .thumb { background: var(--fog); border-radius: 16px; display: grid; place-items: center; padding: 6px; }
.spec .thumb svg { width: 120px; height: 120px; }
.spec.locked .thumb svg { filter: brightness(0) opacity(.16); }
.spec h3 { font-size: 1.25rem; }
.spec .latin { margin: 0; font-style: italic; color: var(--moss-2); font-size: .88rem; }
.spec p { margin: 0; font-size: .93rem; }
.spec .kitchen { color: var(--moss-2); }
.spec .grown { font: 500 .75rem var(--f-mono); color: var(--pink); text-transform: uppercase; letter-spacing: .06em; }
.basket { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px 20px; display: grid; gap: 10px; }
.basket ol { list-style: none; margin: 0; padding: 0; display: grid; }
.basket li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.basket li:first-child { border-top: 0; }
.basket li svg { width: 44px; height: 44px; }
.basket .who { font-weight: 700; }
.basket .what { color: var(--moss-2); font-size: .88rem; }
.basket .g { font: 500 .95rem var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
.empty { color: var(--moss-2); margin: 0; }

.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--moss-2); font-size: .9rem; padding-top: 6px; border-top: 1px solid var(--line); }
.foot a { color: var(--pink); font-weight: 700; }

/* Modal */
.modal { position: fixed; inset: 0; background: rgba(36, 48, 33, .55); display: grid; place-items: center; padding: 16px; z-index: 20; }
.sheet { background: var(--card); border-radius: 26px; padding: 22px; width: min(440px, 100%); max-height: calc(100% - 16px); overflow: auto; display: grid; gap: 14px; text-align: center; }
.sheet img { width: 100%; border-radius: 16px; display: block; }
.sheet .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.sheet .hint { margin: 0; color: var(--moss-2); font-size: .85rem; }

/* Scene animation */
.sway { animation: sway 6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes sway { 0%, 100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }
.blink { animation: blink 5.5s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
#plantLayer { transform-box: fill-box; transform-origin: 50% 100%; }
#plantLayer.bounce { animation: bounce .7s ease; }
@keyframes bounce { 0%, 100% { transform: scale(1, 1); } 30% { transform: scale(1.04, .95); } 60% { transform: scale(.97, 1.04); } }
.mote { animation: mote linear infinite; }
@keyframes mote { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: .75; } 100% { transform: translate(14px, -130px); opacity: 0; } }
.fx { animation: fx 1.2s ease-out forwards; opacity: 0; }
@keyframes fx { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 20% { opacity: .95; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1); } }
.tool { animation: tool 1.4s ease forwards; opacity: 0; }
@keyframes tool { 0% { opacity: 0; transform: translateY(10px); } 15%, 75% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) {
  .sway, .blink, .mote, #plantLayer.bounce { animation: none; }
  .mote { display: none; }
}

@media (max-width: 780px) {
  .grow { grid-template-columns: minmax(0, 1fr); }
  h2 { font-size: 1.8rem; }
  .brand span { font-size: 1.35rem; }
  .tabs button { padding: 7px 11px; }
  .panel { padding: 18px 16px; }
}
@media (max-width: 380px) {
  .meters { grid-template-columns: minmax(0, 1fr); }
  .act small { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" id="brandLink" href="https://moshruums.com" target="_blank" rel="noopener">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 21C5 10 14 5 20 5s15 5 15 16c-4 2-26 2-30 0Z" fill="#B44F6E"/><circle cx="13" cy="13" r="2.6" fill="#F6DCE3"/><circle cx="24" cy="10" r="2" fill="#F6DCE3"/><circle cx="28" cy="16" r="1.6" fill="#F6DCE3"/><path d="M14 22c0 7-1 10-2 13h16c-1-3-2-6-2-13Z" fill="#F7F9F3" stroke="#2F412C" stroke-width="2" stroke-linejoin="round"/><circle cx="17" cy="28" r="1.3" fill="#2F412C"/><circle cx="23" cy="28" r="1.3" fill="#2F412C"/></svg>
      <span>Moshruum Patch</span>
    </a>
    <nav class="tabs" role="tablist" aria-label="Views">
      <button role="tab" id="tabGrow" aria-selected="true" aria-controls="growView">Grow room</button>
      <button role="tab" id="tabGuide" aria-selected="false" aria-controls="guideView">Field guide <span class="count" id="guideCount">0/9</span></button>
    </nav>
    <button class="icon-btn" id="soundBtn" aria-pressed="true" aria-label="Sound on" title="Sound"></button>
  </header>

  <main>
    <section id="growView" class="grow" role="tabpanel" aria-labelledby="tabGrow">
      <div class="scene-wrap">
        <svg id="scene" viewBox="0 0 400 440" role="img" aria-label="Your mushroom grow block on a wooden table">
          <g id="bgLayer"></g>
          <g id="plantLayer"></g>
          <g id="fxLayer"></g>
        </svg>
      </div>
      <div class="panel" id="panel"></div>
    </section>

    <section id="guideView" class="guide" role="tabpanel" aria-labelledby="tabGuide" hidden></section>
  </main>

  <footer class="foot">
    <span>A cozy little game from Moshruums, an urban mushroom farm in Metro Detroit.</span>
    <a id="shopLink" href="https://moshruums.com" target="_blank" rel="noopener">Taste the real thing →</a>
  </footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="sheet"></div>
</div>

<script>
(() => {
'use strict';

/* ---------- Settings you may want to change ---------- */
const SHOP_URL = 'https://moshruums.com';
const STORE_KEY = 'moshruum-patch-v1';

/* Time-lapse for demos: add ?speed=60 to the URL, or #timelapse (120x). */
let SPEED = 1;
try {
  const q = Number(new URLSearchParams(location.search).get('speed'));
  if (q > 0) SPEED = q;
  if (location.hash === '#timelapse') SPEED = 120;
} catch (e) { /* ignore */ }
SPEED = Math.min(Math.max(SPEED, 1), 2000);

/* ---------- Data ---------- */
const STAGES = [
  { label: 'Just planted', at: 0 },
  { label: 'Colonizing', at: 40 },
  { label: 'Pinning', at: 260 },
  { label: 'Baby mushrooms', at: 420 },
  { label: 'Fruiting', at: 640 },
  { label: 'Ready to harvest', at: 1000 },
];
const MAX = 1000;
const RH_IDEAL = 85, CO2_IDEAL = 1000;

const SPECIES = {
  blue: {
    name: 'Blue Oyster', latin: 'Pleurotus ostreatus', tag: 'BLUE OYSTER', grams: 220, pin: '#6F86A3',
    fact: 'Caps start a deep slate blue and fade to soft grey as they open. Oysters fruit in overlapping shelves, like a stack of little fans.',
    kitchen: 'Tear them by hand and sear in a hot pan until the edges go crispy.',
  },
  pink: {
    name: 'Pink Oyster', latin: 'Pleurotus djamor', tag: 'PINK OYSTER', grams: 200, pin: '#E58AA4',
    fact: 'A warmth-loving oyster and one of the fastest growers. The bright pink fades to tan once it is cooked.',
    kitchen: 'Pan-fry until crisp for a savory, almost bacon-like bite.',
  },
  golden: {
    name: 'Golden Oyster', latin: 'Pleurotus citrinopileatus', tag: 'GOLDEN OYSTER', grams: 180, pin: '#E9B92F',
    fact: 'Grows in bouquets of lemon-yellow funnels with thin, delicate caps.',
    kitchen: 'Nutty and a little floral. Cook quickly with butter and add at the very end.',
  },
  lions: {
    name: "Lion's Mane", latin: 'Hericium erinaceus', tag: "LION'S MANE", grams: 280, pin: '#EFE3C9',
    fact: 'No caps and no gills. It grows as a shaggy pom-pom of soft, dangling spines.',
    kitchen: 'Slice into thick steaks and sear in butter. Many people say it tastes like crab.',
  },
  pioppino: {
    name: 'Pioppino', latin: 'Cyclocybe aegerita', tag: 'PIOPPINO', grams: 170, pin: '#7A4E33',
    fact: 'Named after the Italian word for poplar tree. Grows in tight bunches of long stems topped with chestnut-brown caps.',
    kitchen: 'Keeps a firm, crunchy stem when cooked. Lovely in risotto and stir-fries.',
  },
  king: {
    name: 'King Trumpet', latin: 'Pleurotus eryngii', tag: 'KING TRUMPET', grams: 240, pin: '#B8916A',
    fact: 'The biggest oyster relative. The thick, meaty stem is the best part.',
    kitchen: 'Cut the stem into coins, score them, and sear like scallops.',
  },
  pearl: {
    name: 'Black Pearl King', latin: 'Pleurotus hybrid', tag: 'BLACK PEARL', grams: 230, pin: '#4A4D55',
    fact: 'A cross between king trumpet and oyster mushrooms, with dark pearl-grey caps on sturdy stems.',
    kitchen: 'Roast or grill whole. The stems stay juicy and the caps turn golden.',
  },
  maitake: {
    name: 'Maitake', latin: 'Grifola frondosa', tag: 'MAITAKE', grams: 300, pin: '#8A715E',
    fact: 'Also called hen of the woods for its ruffled, feathery fronds. Maitake means "dancing mushroom" in Japanese.',
    kitchen: 'Pull into clusters and roast at high heat until the edges crackle.',
  },
  nameko: {
    name: 'Nameko', latin: 'Pholiota nameko', tag: 'NAMEKO', grams: 130, pin: '#C8682C',
    fact: 'Little amber caps with a naturally glossy coat. A favorite in Japanese miso soup.',
    kitchen: 'Simmer in soups and stews. The glossy coat gives broth a silky body.',
  },
};
const ORDER = ['blue', 'pink', 'golden', 'lions', 'pioppino', 'king', 'pearl', 'maitake', 'nameko'];
const NAMES = ['Puff', 'Button', 'Mossy', 'Dewdrop', 'Bun', 'Pebble', 'Toffee', 'Biscuit', 'Nugget', 'Fern', 'Sprout', 'Mochi', 'Pip', 'Clover', 'Hazel', 'Juniper', 'Dumpling', 'Noodle', 'Marble', 'Waffle', 'Bramble', 'Pudding', 'Sesame', 'Bean', 'Taffy', 'Gnocchi'];

/* ---------- State ---------- */
let state = load();
let view = 'grow';
let pickSpecies = 'blue';
let pickName = randomName();
let noteText = '', noteUntil = 0, noteWarm = true;
let confirmCompost = false;
let lastBgKey = '', lastPlantKey = '', panelMode = '';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function blankState() { return { v: 1, plant: null, harvests: [], sound: true }; }
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && s.v === 1) return Object.assign(blankState(), s);
    }
  } catch (e) { /* storage unavailable */ }
  return blankState();
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
}

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const r1 = n => Math.round(n * 10) / 10;
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function randomName() { return NAMES[Math.floor(Math.random() * NAMES.length)]; }
function fmtDur(min) {
  min = Math.max(0, Math.round(min));
  if (min < 60) return min + ' min';
  const d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60), m = min % 60;
  if (d) return d + ' d ' + h + ' h';
  return h + ' h' + (m ? ' ' + m + ' min' : '');
}
function fmtDate(t) {
  const d = new Date(t);
  return (d.getMonth() + 1) + '/' + d.getDate();
}
function stageIndex(g) { let i = 0; STAGES.forEach((s, k) => { if (g >= s.at) i = k; }); return i; }
function stageProgress(g) {
  const i = stageIndex(g);
  if (i >= STAGES.length - 1) return 1;
  return (g - STAGES[i].at) / (STAGES[i + 1].at - STAGES[i].at);
}

/* ---------- Simulation ---------- */
function rate(p) {
  const st = stageIndex(p.growth);
  const rhF = p.rh >= RH_IDEAL ? 1 : p.rh >= 70 ? 0.7 : 0.4;
  const co2F = st < 2 ? 1 : p.co2 <= CO2_IDEAL ? 1 : p.co2 <= 1600 ? 0.7 : 0.45;
  return rhF * co2F;

  const st = stageIndex(p.growth), prog = stageProgress(p.growth);
  const R = rng(p.seed);
  const col = st === 0 ? 0.04 + prog * 0.12 : st === 1 ? 0.16 + prog * 0.84 : 1;
  const sp = SPECIES[p.species];
  let s = p.glow && st >= 3 ? GLOW_DEFS : '';
  // block of sawdust substrate
  s += `<rect x="128" y="258" width="144" height="106" rx="12" fill="#D6B486"/>`;
  for (let i = 0; i < 70; i++) {
    s += `<ellipse cx="${r1(134 + R() * 132)}" cy="${r1(264 + R() * 94)}" rx="${r1(1 + R() * 2.2)}" ry="${r1(0.7 + R() * 1)}" fill="${R() > 0.5 ? '#B98F5D' : '#E8D1A8'}"/>`;
  }
  // grain spawn
  for (let i = 0; i < 26; i++) {
    s += `<ellipse cx="${r1(136 + R() * 128)}" cy="${r1(262 + R() * 96)}" rx="2.6" ry="1.4" transform="rotate(${Math.round(R() * 180)} ${r1(136 + R() * 128)} ${r1(262 + R() * 96)})" fill="#F4EBD8" opacity="${r1(0.9 - col * 0.6)}"/>`;
  }
  s += `<rect x="128" y="258" width="144" height="106" rx="12" fill="#FBF8F1" opacity="${r1(col * 0.86 * 100) / 100}"/>`;
  // mycelium threads
  const threads = Math.round(col * 40);
  for (let i = 0; i < 40; i++) {
    let x = 134 + R() * 132, y = 262 + R() * 98;
    let d = `M${r1(x)} ${r1(y)}`;
    for (let k = 0; k < 4; k++) {
      x = clamp(x + (R() - 0.5) * 30, 132, 268); y = clamp(y + (R() - 0.5) * 22, 262, 360);
      d += ` L${r1(x)} ${r1(y)}`;
    }
    if (i < threads) s += `<path d="${d}" stroke="#FFFFFF" stroke-width="1.3" fill="none" opacity=".85" stroke-linejoin="round"/>`;
  }
  // grow bag: closed while colonizing, cut open once it fruits
  if (st < 2) {
    s += `<path d="M120 366 V262 Q120 246 138 238 L150 212 Q200 202 250 212 L262 238 Q280 246 280 262 V366Z" fill="#FFFFFF" fill-opacity=".2" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="2"/>`;
    s += `<path d="M150 212 Q172 196 200 200 Q228 196 250 212" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="2"/><rect x="182" y="198" width="36" height="8" rx="3" fill="#E9E2D2" stroke="#CFC6B3"/>`;
  } else {
    s += `<path d="M120 366 V266 Q120 252 132 250 M280 366 V266 Q280 252 268 250" fill="none" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="2"/><path d="M120 366 V266 Q120 252 132 250 L268 250 Q280 252 280 266 V366Z" fill="#FFFFFF" fill-opacity=".14"/>`;
  }
  s += `<path d="M134 274 V350" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>`;
  // farm label sticker
  s += `<g transform="rotate(-3 200 330)"><rect x="152" y="314" width="96" height="30" rx="4" fill="#FFFDF6" stroke="#D9CBB0"/>`;
  s += `<text x="200" y="327" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="8" fill="#2F412C" letter-spacing=".5">${esc(sp.tag)}</text>`;
  s += `<text x="200" y="338" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="7" fill="#5B6D55">IN ${fmtDate(p.plantedAt || Date.now())} · ${esc(p.name.toUpperCase().slice(0, 10))}</text></g>`;
  // pins
  if (st === 2) {
    const k = 0.35 + prog * 0.65;
    for (let i = 0; i < 6; i++) {
      const x = 200 + (i - 2.5) * 13 + (R() - 0.5) * 6, h = (6 + R() * 10) * k, rr = (3 + R() * 2.5) * k;
      s += `<path d="M${r1(x)} 264 v${r1(-h - 2)}" stroke="#D9CCB2" stroke-width="${r1(rr * 1.1 + 2)}" stroke-linecap="round"/><path d="M${r1(x)} 264 v${r1(-h - 2)}" stroke="#F3EDE0" stroke-width="${r1(rr * 1.1)}" stroke-linecap="round"/><circle cx="${r1(x)}" cy="${r1(262 - h)}" r="${r1(rr)}" fill="${sp.pin}"/>`;
    }
  }
  if (st >= 3) {
    const sc = st === 3 ? 0.3 + prog * 0.25 : st === 4 ? 0.55 + prog * 0.43 : 1;
    s += `<g transform="translate(200 264)"><g class="sway"${p.glow ? ' filter="url(#glowF)"' : ''}><g transform="scale(${r1(sc * 100) / 100})">${drawSpecies(p.species, md, p.seed)}</g></g></g>`;
  }
  return s;
}

/* ---------- Scene rendering ---------- */
function renderScene(force) {
  const per = period();
  if (force || per !== lastBgKey) { $('bgLayer').innerHTML = bgMarkup(per, !reduceMotion); lastBgKey = per; }
  const p = state.plant || { species: pickSpecies, name: pickName, seed: 11, growth: 0, plantedAt: Date.now(), glow: false };
  const md = state.plant ? mood(p) : 'happy';
  const st = stageIndex(p.growth);
  const key = [p.species, p.name, p.seed, st, Math.round(stageProgress(p.growth) * 60), md, p.glow].join('|');
  if (force || key !== lastPlantKey) { $('plantLayer').innerHTML = plantMarkup(p, md); lastPlantKey = key; }
}

/* ---------- FX ---------- */
function fx(markup, ms = 1600) {

  g.innerHTML = markup;
  $('fxLayer').appendChild(g);
  setTimeout(() => g.remove(), ms);
}
function fxMist() {

}
function fxFan() {
  let s = '';
  for (let i = 0; i < 5; i++) {
    const y = 140 + i * 26 + Math.random() * 10;
    s += `<path class="fx" d="M${r1(10 + Math.random() * 30)} ${r1(y)} q20 -9 40 0 t40 0 t40 0" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity=".9" style="--dx:${r1(180 + Math.random() * 60)}px;--dy:${r1(-10 + Math.random() * 20)}px;animation-delay:${r1(i * 0.08)}s"/>`;

}
function fxSing() {
  let s = '';
  const glyphs = ['♪', '♫', '♪', '♥', '♫', '♥'];
  glyphs.forEach((g, i) => {
    const heart = g === '♥';
    s += `<text class="fx" x="${r1(170 + Math.random() * 60)}" y="${r1(170 + Math.random() * 40)}" font-size="${heart ? 20 : 24}" fill="${heart ? '#E58AA4' : '#5B6D55'}" font-family="system-ui, sans-serif" style="--dx:${r1(-40 + Math.random() * 80)}px;--dy:${r1(-80 - Math.random() * 40)}px;animation-delay:${r1(i * 0.15)}s">${g}</text>`;
  });
  fx(s, 2200);
}
function fxSparkle() {
  let s = '';
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 90;
    s += `<path class="fx" d="M200 190 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" fill="${i % 2 ? '#F2C14E' : '#FFFFFF'}" style="--dx:${r1(Math.cos(a) * d)}px;--dy:${r1(Math.sin(a) * d)}px;animation-delay:${r1(Math.random() * 0.3)}s"/>`;
  }

}
function bounce() {
  const el = $('plantLayer');
  el.classList.remove('bounce');

  el.classList.add('bounce');
}

/* ---------- Sound (generated, no files) ---------- */
let actx = null;
function audio() {
  if (!state.sound) return null;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  } catch (e) { return null; }
}
function tone(freq, at, dur, type = 'triangle', vol = 0.1) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + at;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function hiss(at, dur, f1, f2, vol = 0.06, type = 'bandpass') {
  const a = audio(); if (!a) return;
  const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource(), flt = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + at;
  src.buffer = buf; flt.type = type; flt.frequency.setValueAtTime(f1, t); flt.frequency.linearRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(flt).connect(g).connect(a.destination);
  src.start(t); src.stop(t + dur + 0.05);
}
const SFX = {
  mist() { hiss(0, 0.28, 5500, 6500, 0.07); hiss(0.34, 0.28, 5500, 6500, 0.07); },
  fan() { hiss(0, 1.0, 300, 1400, 0.05, 'lowpass'); },
  sing() {
    const scale = [523, 587, 659, 784, 880, 1047];
    for (let i = 0; i < 6; i++) tone(scale[Math.floor(Math.random() * scale.length)], i * 0.17, 0.3, 'sine', 0.09);
  },
  plant() { tone(330, 0, 0.12, 'sine', 0.12); tone(494, 0.08, 0.2, 'sine', 0.1); },
  harvest() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.09, 0.45, 'triangle', 0.08)); },
  tap() { tone(660, 0, 0.08, 'sine', 0.05); },
};

/* ---------- Notes ---------- */
function say(text, warm = true, ms = 6000) { noteText = text; noteWarm = warm; noteUntil = Date.now() + ms; updatePanel(); }
function tip(p) {
  const st = stageIndex(p.growth);
  if (st >= 5) return { t: `${p.name} is ready! Harvest by twisting the cluster gently off the block.`, warm: true };
  if (p.rh < RH_IDEAL) return { t: `Humidity is down to ${Math.round(p.rh)}%. Mushrooms like 85–95%, so a mist would help.`, warm: true };
  if (st >= 2 && p.co2 > 1600) return { t: `It's stuffy in here (${Math.round(p.co2)} ppm CO₂). Without fresh air, stems grow long and skinny as they reach for oxygen.`, warm: true };
  if (st >= 2 && p.co2 > CO2_IDEAL) return { t: `CO₂ is creeping up. Fresh air keeps caps wide and stems short.`, warm: true };
  return { t: [
    'Freshly planted. The spawn is waking up inside its sawdust block.',
    'White mycelium is spreading through the block. It likes the air a little stuffy right now, so just keep it humid.',
    'Pins are popping up! From here on, mushrooms want plenty of fresh air and humidity.',
    'Baby mushrooms! They can nearly double in size in a day when they are happy.',
    'Caps are opening up. Keep the air fresh and damp for a big harvest.',
  ][st], warm: false };
}

function updatePanel() {
  const p = state.plant;

  $('harvestBtn').textContent = `Harvest ${p.name}`;
  $('confirmBox').hidden = !confirmCompost;
  $('minor').hidden = confirmCompost;
}

/* ---------- Actions ---------- */
function plantNow() {
  const name = (pickName || '').trim().slice(0, 18) || randomName();
  const now = Date.now();
  state.plant = {
    species: pickSpecies, name, seed: Math.floor(Math.random() * 1e9), glow: Math.random() < 1 / 12,
    growth: 0, rh: 92, co2: 650, ageMin: 0, plantedAt: now, lastTick: now,
    careSum: 0, careMin: 0, lastSing: 0, lastAct: now,
  };
  save();
  SFX.plant();
  renderPanel(); renderScene(true); bounce();
  say(`${name} is tucked into a fresh block of hardwood sawdust. Come back over the next day to see it grow.`, false, 8000);
}

const busy = {};
function act(kind, btn) {
  const p = state.plant;
  if (!p || busy[kind]) return;
  advance();
  busy[kind] = true; btn.disabled = true;
  setTimeout(() => { busy[kind] = false; btn.disabled = false; }, 1300);
  const st = stageIndex(p.growth);
  const before = stageIndex(p.growth);
  p.lastAct = Date.now();
  if (kind === 'mist') {
    SFX.mist(); fxMist();
    if (p.rh < RH_IDEAL) { grow(p, 10); say(`Pssst, pssst. Lovely and humid again.`, false); }
    else { grow(p, 1); say(`It's already nice and damp. Too much water can make it soggy.`, false); }
    p.rh = Math.min(97, p.rh + 22);
  } else if (kind === 'fan') {
    SFX.fan(); fxFan();
    if (st < 2) { say(`Mycelium likes it a little stuffy while it colonizes. Save the fresh air for when pins appear.`, false); }
    else if (p.co2 > CO2_IDEAL) { grow(p, 10); p.co2 = Math.max(480, p.co2 - 900); say(`Whoosh! A big breath of fresh air.`, false); }
    else { grow(p, 1); p.co2 = Math.max(480, p.co2 - 300); say(`The air is already fresh in here.`, false); }
  } else if (kind === 'sing') {
    SFX.sing(); fxSing(); bounce();
    const recent = Date.now() - (p.lastSing || 0) < 3 * 60000;
    grow(p, recent ? 1 : 4);
    p.lastSing = Date.now();
    const lines = st < 3
      ? ['Something inside the block wiggles along.', 'The mycelium hums back, very quietly.']
      : [`${p.name} sways to the tune.`, `${p.name} wiggles happily.`, `${p.name} would like an encore.`];
    say(lines[Math.floor(Math.random() * lines.length)], false);
  }
  const after = stageIndex(p.growth);
  if (after > before) stageUp(p, after);
  save();
  renderScene(); updatePanel();
}
function stageUp(p, st) {
  SFX.harvest(); fxSparkle(); bounce();
  if (st === 3 && p.glow) say(`Oh! ${p.name} is glowing. This one is a rare glow-in-the-dark find.`, true, 9000);
  else if (st === 5) say(`${p.name} is fully grown and ready to harvest!`, true, 9000);
  else say(`New stage: ${STAGES[st].label.toLowerCase()}!`, true, 6000);
}

function cardData(p) {
  const st = stageIndex(p.growth);
  return { species: p.species, name: p.name, seed: p.seed, glow: p.glow, growth: p.growth, plantedAt: p.plantedAt,
    line: `${SPECIES[p.species].name} · ${STAGES[st].label.toLowerCase()}` };
}
function harvest() {
  const p = state.plant;
  if (!p || stageIndex(p.growth) < 5) return;
  const quality = p.careMin ? clamp(p.careSum / p.careMin, 0.2, 1) : 1;
  const grams = Math.round(SPECIES[p.species].grams * (0.7 + 0.5 * quality) * (0.92 + Math.random() * 0.16));
  const rec = { species: p.species, name: p.name, grams, glow: p.glow, date: Date.now(), ageMin: Math.round(p.ageMin), seed: p.seed };
  state.harvests.unshift(rec);
  const card = cardData(p);
  card.line = `${SPECIES[p.species].name} · ${grams} g harvested`;
  state.plant = null;
  pickName = randomName();
  save();
  SFX.harvest(); fxSparkle();
  renderPanel(); renderScene(true); updateCount();
  openModal(`
    <p class="eyebrow">Harvest day</p>
    <h2 id="modalTitle">${esc(rec.name)} weighed in at ${grams} g</h2>
    <div style="background:var(--fog);border-radius:18px;padding:10px">${thumbSvg(rec.species)}</div>
    <p class="hint">${esc(SPECIES[rec.species].name)} grown in ${fmtDur(rec.ageMin)}. ${rec.glow ? 'A rare glowing one, too! ' : ''}It's in your basket, and its page in the field guide is filled in.</p>
    <div class="row"><button class="btn soft" id="mCard">Save a picture</button><button class="btn primary" id="mAgain">Plant another</button></div>`);
  $('mAgain').addEventListener('click', closeModal);
  $('mCard').addEventListener('click', () => showCard(card));
  $('mAgain').focus();
}

/* ---------- Picture card ---------- */
async function makeCard(c) {
  const fake = { species: c.species, name: c.name, seed: c.seed, glow: c.glow, growth: c.growth, plantedAt: c.plantedAt };
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="960" height="1056">${bgMarkup(period(), false)}${plantMarkup(fake, 'happy')}</svg>`;
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  try { await Promise.all([document.fonts.load('700 72px Gluten'), document.fonts.load('600 34px Karla'), document.fonts.load('500 28px "DM Mono"')]); } catch (e) { /* fallback fonts */ }
  const cv = document.createElement('canvas');
  cv.width = 1080; cv.height = 1350;
  const x = cv.getContext('2d');
  x.fillStyle = '#E3EADD'; x.fillRect(0, 0, 1080, 1350);
  x.save();
  x.beginPath();
  if (x.roundRect) x.roundRect(60, 60, 960, 1056, 48); else x.rect(60, 60, 960, 1056);
  x.clip();
  x.drawImage(img, 60, 60, 960, 1056);
  x.restore();
  x.fillStyle = '#2F412C';
  x.font = '700 72px Gluten, "Trebuchet MS", sans-serif';
  x.fillText(c.name, 70, 1210);
  x.fillStyle = '#5B6D55';
  x.font = '600 34px Karla, system-ui, sans-serif';
  x.fillText(c.line, 72, 1262);
  x.fillStyle = '#B44F6E';
  x.font = '500 28px "DM Mono", ui-monospace, monospace';
  x.textAlign = 'right';
  x.fillText('grown at moshruums.com', 1010, 1308);
  return cv;
}
async function showCard(c) {
  let url = '', cv = null;
  try { cv = await makeCard(c); url = cv.toDataURL('image/png'); } catch (e) { url = ''; }
  const file = (c.name || 'mushroom').replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '-moshruum.png';
  openModal(`
    <h2 id="modalTitle">${esc(c.name)}'s portrait</h2>
    ${url ? `<img src="${url}" alt="Picture of ${esc(c.name)}, a ${esc(SPECIES[c.species].name)} mushroom">` : '<p class="hint">This browser could not draw the picture.</p>'}
    <p class="hint">On a phone, press and hold the picture to save it.</p>
    <div class="row">${url ? `<a class="btn soft" id="dlBtn" href="${url}" download="${file}" style="text-decoration:none">Download</a>` : ''}<button class="btn soft" id="shareBtn" hidden>Share</button><button class="btn primary" id="closeBtn">Done</button></div>`);
  $('closeBtn').addEventListener('click', closeModal);
  if (cv && navigator.canShare) {
    cv.toBlob(blob => {
      if (!blob) return;
      const f = new File([blob], file, { type: 'image/png' });
      if (!navigator.canShare({ files: [f] })) return;
      const b = $('shareBtn');
      if (!b) return;
      b.hidden = false;
      b.addEventListener('click', () => navigator.share({ files: [f], title: c.name, text: `Meet ${c.name}, grown at moshruums.com` }).catch(() => {}));
    }, 'image/png');
  }
}

/* ---------- Modal ---------- */
let lastFocus = null;
function openModal(html) {
  lastFocus = document.activeElement;
  $('sheet').innerHTML = html;
  $('modal').hidden = false;
  const first = $('sheet').querySelector('button, a');
  if (first) first.focus();
}
function closeModal() {
  $('modal').hidden = true;
  if (lastFocus && lastFocus.isConnected) lastFocus.focus();
  else { const b = document.querySelector('#panel button'); if (b) b.focus(); }
}
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden) closeModal(); });

/* ---------- Field guide ---------- */
function updateCount() {
  const grown = new Set(state.harvests.map(h => h.species));
  $('guideCount').textContent = `${grown.size}/9`;
}
function renderGuide() {
  const counts = {};
  state.harvests.forEach(h => { counts[h.species] = (counts[h.species] || 0) + 1; });
  const total = state.harvests.reduce((a, h) => a + h.grams, 0);
  const n = Object.keys(counts).length;
  $('guideView').innerHTML = `
    <div class="guide-head">
      <div><p class="eyebrow">Field guide</p><h2>Mushrooms of the farm</h2></div>
      <p>${n} of 9 varieties grown · ${total.toLocaleString('en-US')} g harvested</p>
    </div>
    <div class="cards">
      ${ORDER.map(id => {
        const sp = SPECIES[id], c = counts[id] || 0;
        return `<article class="spec${c ? '' : ' locked'}">
          <div class="thumb">${thumbSvg(id, !!c)}</div>
          <div><h3>${esc(sp.name)}</h3><p class="latin">${esc(sp.latin)}</p></div>
          <div style="display:grid;gap:8px;align-content:start">
            ${c ? `<span class="grown">Grown ${c}×</span><p>${esc(sp.fact)}</p><p class="kitchen"><strong>In the kitchen:</strong> ${esc(sp.kitchen)}</p>`
                : `<p class="kitchen">Grow and harvest one to fill in this page.</p>`}
          </div>
        </article>`;
      }).join('')}
    </div>
    <div class="basket">
      <h3>Your basket</h3>
      ${state.harvests.length ? `<ol>${state.harvests.slice(0, 50).map(h => `
        <li>${thumbSvg(h.species)}<div><div class="who">${esc(h.name)}${h.glow ? ' ✦' : ''}</div><div class="what">${esc(SPECIES[h.species].name)} · harvested ${fmtDate(h.date)}</div></div><span class="g">${h.grams} g</span></li>`).join('')}</ol>`
        : '<p class="empty">Nothing here yet. Harvest your first block and it will show up in your basket.</p>'}
    </div>`;
}
function setView(v) {
  view = v;
  $('tabGrow').setAttribute('aria-selected', String(v === 'grow'));
  $('tabGuide').setAttribute('aria-selected', String(v === 'guide'));
  $('growView').hidden = v !== 'grow';
  $('guideView').hidden = v !== 'guide';
  if (v === 'guide') renderGuide();
  SFX.tap();
}
$('tabGrow').addEventListener('click', () => setView('grow'));
$('tabGuide').addEventListener('click', () => setView('guide'));

function renderSound() {
  const b = $('soundBtn');
  b.innerHTML = state.sound ? ICONS.soundOn : ICONS.soundOff;
  b.setAttribute('aria-pressed', String(state.sound));
  b.setAttribute('aria-label', state.sound ? 'Sound on' : 'Sound off');
}
$('soundBtn').addEventListener('click', () => { state.sound = !state.sound; save(); renderSound(); SFX.tap(); });

/* ---------- Boot ---------- */
['brandLink', 'shopLink'].forEach(id => { $(id).href = SHOP_URL; });
renderSound();
updateCount();
if (state.plant) {
  const p = state.plant;
  const away = (Date.now() - p.lastTick) / 60000;
  const before = p.growth;
  advance();
  const grew = p.growth - before;
  if (away > 10) {
    const t = tip(p);
    say(`Welcome back! ${p.name} grew ${Math.round(grew / MAX * 100)}% while you were away. ${t.warm ? t.t : ''}`.trim(), true, 12000);
  }
  save();
}
renderPanel();
renderScene(true);

let saveTick = 0;
setInterval(() => {
  const p = state.plant;
  if (p) {
    const before = stageIndex(p.growth);
    advance();
    const after = stageIndex(p.growth);
    if (after > before) stageUp(p, after);
    if (++saveTick % 10 === 0 || after > before) save();
    updatePanel();
  }
  renderScene();
}, 1000);
document.addEventListener('visibilitychange', () => { if (document.hidden) { advance(); save(); } });
window.addEventListener('pagehide', () => { advance(); save(); });

/* Test hook: window.moshruum.debug.setGrowth(700) etc. */
window.moshruum = { debug: {
  setGrowth(g) { if (state.plant) { state.plant.growth = clamp(g, 0, MAX); save(); updatePanel(); renderScene(true); } },
  state: () => state,
} };
})();
</script>
</body>
